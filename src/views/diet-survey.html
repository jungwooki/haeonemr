<!-- ===================== 다이어트 (H-SCORE) 문진 ===================== -->
<div id="diet-app-shell" class="flex-col w-screen h-screen bg-[var(--ios-bg)] relative overflow-hidden" style="display:none;">
  <div class="h-16 bg-white/90 backdrop-blur-md border-b border-[#EDEEF1] flex items-center justify-between px-4 shrink-0 z-30 relative">
    <button onclick="dietPrevStep()" class="text-slate-800 flex items-center gap-1 font-semibold text-[16px] active:opacity-50 transition-opacity w-20">
      <i data-lucide="chevron-left" class="w-6 h-6 -ml-2"></i> <span id="diet-btn-back-label">메인으로</span>
    </button>
    <div class="flex items-center gap-2 absolute left-1/2 -translate-x-1/2">
      <div class="w-7 h-7 bg-[#e5ecfd] rounded-[8px] flex items-center justify-center border border-[#b0caff]">
        <i data-lucide="scale" class="w-4 h-4 text-[#799bf4]"></i>
      </div>
      <span id="diet-nav-title" class="font-bold text-[17px] text-black">소개</span>
    </div>
    <div class="w-20"></div>
  </div>
  <div class="h-[3px] w-full bg-[#EDEEF1] shrink-0">
    <div id="diet-progress-fill" class="h-full bg-[#799bf4] transition-all duration-300" style="width:0%"></div>
  </div>

  <div id="diet-scroll-container" class="flex-1 overflow-y-auto w-full px-5 pt-6 pb-10 scroll-smooth">
    <div class="w-full max-w-2xl md:max-w-3xl mx-auto flex flex-col">

      <div id="diet-step-1" class="diet-step-content active flex-col items-center text-center justify-center mt-10">
        <div class="w-[100px] h-[100px] bg-white rounded-[28px] flex items-center justify-center mb-8 shadow-sm border border-gray-100">
          <i data-lucide="scale" class="w-[50px] h-[50px] text-[#799bf4]"></i>
        </div>
        <h2 class="text-[32px] font-extrabold tracking-tight text-black mb-4">해온 다이어트 H-SCORE</h2>
        <p class="text-[17px] text-[#3C3C43] leading-[26px] mb-12 max-w-md px-4">
          3대를 이어가는 한의원, 해온한의원을 찾아주셔서 감사합니다.<br>다이어트 문진은 체질을 살펴 건강한 감량 방향을 찾아드리기 위한 문진입니다. 작성해 주신 내용은 오장 균형과 기혈수 변증 리포트로 정리해 드립니다.
        </p>
        <button onclick="dietNextStep()" class="w-full max-w-xs bg-[#799bf4] text-white font-bold text-[18px] py-4 rounded-[16px] shadow-sm hover:bg-[#799bf4] active:scale-[0.98] transition-all">
          문진표 작성 시작하기
        </button>
      </div>

      <div id="diet-dynamic-container" class="diet-step-content flex-col gap-3 w-full"></div>
    </div>
  </div>

  <div id="diet-bottom-action" class="shrink-0 bg-white border-t border-gray-200 p-4 pb-6 flex justify-center hidden z-40">
    <button onclick="dietNextStep()" id="diet-next-btn" class="w-full max-w-2xl bg-[#799bf4] text-white font-bold text-[18px] py-4 rounded-[16px] shadow-sm hover:bg-[#799bf4] active:scale-[0.98] transition-all">다음 단계</button>
  </div>
</div>
