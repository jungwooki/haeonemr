<!-- MPS mental survey: question data and analysis preserved from supplied HTML. -->
<div id="mental-survey-view" hidden>
  <dialog id="mental-exit-dialog" class="survey-exit-dialog" aria-labelledby="mental-exit-title" aria-describedby="mental-exit-description">
    <h2 id="mental-exit-title">설문 작성을 종료할까요?</h2>
    <p id="mental-exit-description">아직 제출하지 않은 이름과 응답은 저장되지 않습니다. 계속 작성하면 입력한 내용을 유지할 수 있습니다.</p>
    <div><button type="button" onclick="MpsMental.discardAndExit()">저장하지 않고 종료</button><button type="button" autofocus onclick="document.getElementById('mental-exit-dialog').close()">계속 작성하기</button></div>
  </dialog>
  <header class="mental-header"><button type="button" onclick="MpsMental.back()" class="mental-back">← 메인화면으로</button><span>AI MPS M-서베이</span><span class="mental-header-tag">MENTAL</span></header>
<section id="mentalSportScreen" class="screen active w-full flex-col items-center">
  <div class="mental-intro"><span class="mental-eyebrow">MPS · MENTAL</span><h1>AI MPS M-서베이</h1><p>나에게 맞는 종목을 선택해 주세요.</p></div>
  <div id="sportChoices" class="mental-sport-grid"></div>
</section>
<!-- ============ SCREEN 1: 기본 정보 ============ -->
<div id="screenInfo" class="screen min-h-screen w-full items-center justify-center p-6">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg shadow-sm mb-4">
        <i data-lucide="clipboard-list" class="mental-icon"></i>
      </div>
      <h1 class="text-xl font-extrabold text-slate-800">AI MPS M-서베이</h1>
      <p class="text-sm text-slate-400 mt-1"><span id="mentalSelectedSport"></span> · 시작하기 전에 정보를 입력해주세요</p>
    </div>

    <div class="space-y-5">
      <div>
        <label for="inputName" class="block text-sm font-bold text-slate-600 mb-2">이름</label>
        <input id="inputName" type="text" autocomplete="name" enterkeyhint="next" required placeholder="이름을 입력하세요"
          class="w-full rounded-xl border-2 border-slate-200 p-3.5 text-base focus:border-blue-600 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-600 mb-2">성별</label>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" aria-pressed="false" class="choice-btn gender-btn rounded-xl p-3.5 font-bold text-slate-500" data-val="남">남자</button>
          <button type="button" aria-pressed="false" class="choice-btn gender-btn rounded-xl p-3.5 font-bold text-slate-500" data-val="여">여자</button>
        </div>
      </div>

      <div>
        <label for="inputDob" class="block text-sm font-bold text-slate-600 mb-2">생년월일</label>
        <input id="inputDob" type="date" autocomplete="bday" aria-describedby="mental-info-hint" required
          class="w-full rounded-xl border-2 border-slate-200 p-3.5 text-base focus:border-blue-600 focus:outline-none">
      </div>


    </div>

    <p id="mental-info-hint" role="status" aria-live="polite"></p>
    <button id="btnStart" disabled
      class="nav-btn w-full mt-8 bg-blue-600 text-white font-extrabold text-base py-4 rounded-xl disabled:bg-slate-300">
      서베이 시작하기
    </button>
  </div>
</div>

<!-- ============ SCREEN 2: 서베이 ============ -->
<div id="screenSurvey" class="screen min-h-screen w-full flex-col">
  <div class="px-4 pt-4 pb-2 max-w-2xl w-full mx-auto">
    <div class="flex items-center justify-between mb-2">
      <span id="progressText" class="text-xs font-bold text-slate-400"></span>
      <span class="text-xs font-bold text-slate-400">6점 척도 · 해당하는 정도를 선택하세요</span>
    </div>
    <div class="progress-track"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
  </div>

  <p id="mental-save-status" class="px-4 max-w-2xl w-full mx-auto text-sm text-blue-700" role="status" aria-live="polite"></p>
  <p id="mental-page-feedback" class="mental-page-feedback" role="status" aria-live="polite"></p>
  <div id="qList" class="flex-1 px-4 py-2 max-w-2xl w-full mx-auto space-y-2.5 overflow-y-auto"></div>

  <div class="px-4 py-3 max-w-2xl w-full mx-auto flex gap-3 border-t border-slate-100 bg-white">
    <button id="btnPrev" class="nav-btn flex-1 border-2 border-slate-200 text-slate-500 font-extrabold py-3.5 rounded-xl">
      <i data-lucide="arrow-left" class="mental-icon mr-1.5"></i>이전
    </button>
    <button id="btnNext" class="nav-btn flex-[2] bg-blue-600 text-white font-extrabold py-3.5 rounded-xl">
      다음<i data-lucide="arrow-right" class="mental-icon ml-1.5"></i>
    </button>
  </div>
</div>

<!-- ============ SCREEN 3: 완료 ============ -->
<div id="screenComplete" class="screen min-h-screen w-full items-center justify-center p-6">
  <div class="text-center">
    <div class="w-20 h-20 mx-auto bg-emerald-50 rounded-full flex items-center justify-center text-emerald-600 text-4xl mb-6">
      <i data-lucide="check" class="mental-icon"></i>
    </div>
    <h1 class="text-2xl font-extrabold text-slate-800">작성 완료</h1>
    <p class="text-slate-500 mt-4">서버에 저장되었습니다. 진료실에서 확인하겠습니다.</p><button type="button" onclick="MpsMental.exit()" class="mt-8 px-6 py-3 rounded-xl bg-blue-600 text-white font-bold">메인화면으로 돌아가기</button><button type="button" id="adminLink" hidden>관리자 확인</button>
  </div>
</div>

<!-- ============ ADMIN PANEL (지도자/스탭용, 기본 숨김) ============ -->
<div id="adminPanel" class="fixed inset-0 bg-white z-50 hidden overflow-y-auto">
  <div class="max-w-3xl mx-auto p-6">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-extrabold text-slate-800"><i data-lucide="shield-check" class="mental-icon text-blue-600 mr-2"></i>결과 요약 (지도자/스탭용)</h2>
      <button onclick="MpsMental.closeAdmin()" aria-label="결과 닫기" class="mental-close">닫기</button>
    </div>
    <div id="adminInfo" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 text-sm"></div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="relative" style="height:300px;"><canvas id="resultChart"></canvas></div>
      <div id="resultTable" class="space-y-2 text-sm"></div>
    </div>
    <div class="flex gap-3 mt-6">
      <button onclick="window.print()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl"><i data-lucide="printer" class="mental-icon mr-1.5"></i>인쇄</button>
      <button onclick="MpsMental.downloadJSON()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl"><i data-lucide="download" class="mental-icon mr-1.5"></i>결과 다운로드(JSON)</button>
    </div>
  </div>
</div>


</div>
<script id="sports-data" type="application/json">{{ include src/data/mental-sports.json }}</script>
