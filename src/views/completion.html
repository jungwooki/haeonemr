<!-- ===================== 작성 완료 화면 (환자용 - 결과 비공개) ===================== -->
<div id="completion-view" class="fixed inset-0 z-50 flex-col items-center bg-white px-6 py-8 overflow-y-auto text-center" style="display:none;">
  <div class="w-20 h-20 shrink-0 mt-auto rounded-full bg-emerald-50 flex items-center justify-center mb-6">
    <i data-lucide="check" class="w-10 h-10 text-emerald-500"></i>
  </div>
  <h2 class="text-[26px] font-extrabold text-black mb-2">작성이 완료되었습니다</h2>
  <p class="text-[15px] text-[#8E8E93] mb-6 max-w-xs">소중한 답변 감사합니다. 진료 준비를 위해 소중히 활용하겠습니다.</p>
  <button onclick="returnToHubFromCompletion()" class="mb-auto bg-blue-600 text-white font-bold text-[16px] px-10 py-4 rounded-[14px] active:scale-[0.98] transition-all">확인 · 다음 환자 준비</button>
</div>
