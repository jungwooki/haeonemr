  let searchTerm = '';

  // --- 유틸: 레이더 차트 SVG 생성 ---
  function radarSVG(data) {
    const size = 300, center = size / 2, radius = 100;
    const axes = [
      { key: 'diag_precision', label: '정밀도', sub: '결과의 정확성' },
      { key: 'diag_speed', label: '신속성', sub: '결과 확인 속도' },
      { key: 'diag_comfort', label: '편안함', sub: '검사 시 부담' },
      { key: 'diag_scope', label: '정보량', sub: '얻어지는 정보 범위' }
    ];
    const angleSlice = (Math.PI * 2) / axes.length;
    const values = axes.map(a => data[a.key] || 0);

    const coord = (value, index) => {
      const angle = index * angleSlice - Math.PI / 2;
      const r = (value / 100) * radius;
      return [center + Math.cos(angle) * r, center + Math.sin(angle) * r];
    };
    const webPoints = (r) => axes.map((_, i) => {
      const angle = i * angleSlice - Math.PI / 2;
      return (center + Math.cos(angle) * r) + ',' + (center + Math.sin(angle) * r);
    }).join(' ');

    const points = values.map((v, i) => coord(v, i).join(',')).join(' ');

    const grids = [20, 40, 60, 80, 100].map((r, i) =>
      `<polygon points="${webPoints(r)}" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="${i === 4 ? '0' : '4 2'}" />`
    ).join('');

    const axesSvg = axes.map((axis, i) => {
      const [x, y] = coord(115, i);
      const [lx, ly] = coord(100, i);
      return `<g>
        <line x1="${center}" y1="${center}" x2="${lx}" y2="${ly}" stroke="#e2e8f0" stroke-width="1" />
        <text x="${x}" y="${y}" text-anchor="middle" alignment-baseline="middle" class="fill-slate-500 font-serif" style="font-size:11px;font-weight:bold;">${axis.label}</text>
        <text x="${x}" y="${y + 12}" text-anchor="middle" alignment-baseline="middle" class="fill-slate-400 font-sans" style="font-size:9px;">${axis.sub}</text>
      </g>`;
    }).join('');

    const dataPolygon = `<polygon points="${points}" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" class="drop-shadow-sm" />`;
    const dots = values.map((v, i) => {
      const [x, y] = coord(v, i);
      return `<circle cx="${x}" cy="${y}" r="4" fill="white" stroke="currentColor" stroke-width="2" />`;
    }).join('');

    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${grids}${axesSvg}${dataPolygon}${dots}</svg>`;
  }

  // --- 필터링 ---
  function getFilteredData() {
    return DIAGNOSTIC_DATA.filter(item => {
      const matchesSearch =
        item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        item.summary.includes(searchTerm) ||
        item.tags.some(tag => tag.includes(searchTerm));
      const matchesCategory = selectedCategory === '전체' || item.category === selectedCategory;
      return matchesSearch && matchesCategory;
    });
  }

  // --- 렌더: 카테고리 필터 ---
  function renderCategories() {
    const container = document.getElementById('category-filters');
    container.innerHTML = CATEGORIES.map(cat => `
      <button data-cat="${cat}" class="px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-all border ${
        selectedCategory === cat
          ? 'bg-slate-800 text-white border-slate-800 shadow-md transform scale-105'
          : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50 hover:border-slate-300'
      }">${cat}</button>
    `).join('');
    container.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedCategory = btn.dataset.cat;
        renderCategories();
        renderGrid();
      });
    });
  }

  // --- 렌더: 카드 ---
  function cardHTML(item) {
    const style = STYLE_MAP[item.type] || STYLE_MAP.lab;

          <i data-lucide="${item.icon}" style="width:100%;height:100%;"></i>
        </div>
        <div class="flex justify-between items-start mb-3 relative z-10">
          <span class="px-2.5 py-1 rounded-lg text-[11px] font-bold tracking-wide ${style.badge}">${item.category}</span>
          <div class="p-1.5 rounded-full bg-slate-50 ${style.text} flex items-center justify-center">
            <i data-lucide="${item.icon}" style="width:18px;height:18px;"></i>
          </div>
        </div>
        <h3 class="text-lg font-bold text-slate-800 mb-1 font-serif group-hover:text-indigo-700 transition-colors relative z-10">${item.name}</h3>
        <p class="text-[13px] text-slate-500 mb-4 line-clamp-2 min-h-[40px] relative z-10">${item.indication}</p>
        <div class="flex flex-wrap gap-1.5 relative z-10">
          ${item.tags.slice(0, 3).map(tag => `<span class="bg-slate-50 text-slate-500 text-[10px] px-2 py-1 rounded-md border border-slate-100 font-medium">#${tag}</span>`).join('')}
        </div>
      </div>
    `;
  }

  function renderGrid() {
    const data = getFilteredData();
    const main = document.getElementById('main-grid');
    if (data.length === 0) {
      main.innerHTML = `
        <div class="flex flex-col items-center justify-center py-24 text-slate-400">
          <i data-lucide="search" class="w-12 h-12 mb-4 opacity-20"></i>
          <p class="text-lg font-medium">검색 결과가 없습니다.</p>
          <p class="text-sm">다른 키워드로 검색해보세요.</p>
        </div>
      `;
    } else {
      main.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
          ${data.map(item => cardHTML(item)).join('')}
        </div>
      `;
      main.querySelectorAll('[data-id]').forEach(card => {
        card.addEventListener('click', () => openModal(card.dataset.id));
      });
    }
    lucide.createIcons();
  }

  // --- 렌더: 모달 ---
  function openModal(id) {
    selectedItem = DIAGNOSTIC_DATA.find(d => d.id === id);
    renderModal();
  }
  function closeModal() {
    selectedItem = null;
    renderModal();
  }

  function renderModal() {
    const root = document.getElementById('modal-root');
    if (!selectedItem) { root.innerHTML = ''; return; }
    const item = selectedItem;
    const style = STYLE_MAP[item.type] || STYLE_MAP.lab;

    root.innerHTML = `
      <div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
        <div id="modal-backdrop" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>

          <div class="w-full md:w-7/12 p-8 overflow-y-auto custom-scrollbar bg-white">

              <div class="flex items-center gap-2 mb-3">

            </div>

            <div class="space-y-6">

                  Summary
