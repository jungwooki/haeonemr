odel": 70, "phase_maint": 80}, "icon": "🫧", "tags": ["임산부가능", "소아부항", "부드러움"]}, {"id": "INJ_BV", "name": "봉독 약침 (Bee Venom)", "category": "약침", "type": "intensive", "indication": "만성 관절염, 디스크, 인대 손상", "summary": "정제된 벌의 독을 이용한 강력한 천연 항염증제", "analogy": "산불을 끄기 위해 맞불을 놓는 것과 같습니다. 면역계를 강하게 깨워 만성적인 염증을 몰아냅니다.", "mechanism": ["멜리틴(Melittin) 성분의 강력한 항염증 작용", "부신피질호르몬 분비 자극", "혈류량 증대"], "chart": {"phase_inflam": 90, "phase_prolif": 80, "phase_remodel": 40, "phase_maint": 20}, "icon": "🐝", "tags": ["천연진통제", "면역치료"]}, {"id": "INJ_PLA", "name": "태반 약침 (자하거)", "category": "약침", "type": "regen", "indication": "갱년기, 만성 피로, 조직 재생 불량", "summary": "성장 인자가 풍부한 태반 추출물 주입", "analogy": "메마른 땅에 주는 최고급 영양제입니다. 세포가 다시 자라나도록 비료를 뿌려주는 역할입니다.", "mechanism": ["조직 재생 인자(Growth Factor) 공급", "항산화 및 간 기능 개선", "호르몬 밸런스 조절"], "chart": {"phase_inflam": 20, "phase_prolif": 100, "phase_remodel": 80, "phase_maint": 60}, "icon": "💉", "tags": ["피로회복", "재생치료"]}, {"id": "INJ_SO", "name": "소염/중성어혈 약침", "category": "약침", "type": "detox", "indication": "급성 통증, 염좌, 교통사고", "summary": "한약재에서 추출한 항염증 성분을 환부에 주입", "analogy": "불난 곳에 물을 뿌리듯, 붓고 열나는 상처 부위에 직접 천연소염제를 발라 식혀줍니다.", "mechanism": ["COX-2 억제를 통한 염증 차단", "부종 감소", "손상 부위 열감 감소"], "chart": {"phase_inflam": 90, "phase_prolif": 50, "phase_remodel": 30, "phase_maint": 10}, "icon": "🌿", "tags": ["급성염좌", "교통사고"]}, {"id": "INJ_SAMGI", "name": "삼기활력약침", "category": "약침", "type": "regen", "indication": "만성 피로, 기력 저하, 수험생 체력 관리, 면역력 증진", "summary": "인삼, 황기 등 기운을 돋우는 약재를 추출하여 경혈에 주입", "analogy": "방전된 배터리를 급속 충전하듯, 지친 몸에 에너지를 즉각적으로 공급합니다.", "mechanism": ["면역 세포 활성화", "에너지 대사 촉진", "항산화 작용을 통한 활성산소 제거"], "chart": {"phase_inflam": 20, "phase_prolif": 90, "phase_remodel": 80, "phase_maint": 100}, "icon": "🌱", "tags": ["기력회복", "보약주사", "만성피로"]}, {"id": "INJ_SAN", "name": "산삼 비만 약침", "category": "약침", "type": "regen", "indication": "비만, 지방세포 분해, 배출촉진", "summary": "산양산삼 추출물을 경혈에 주입하여 정상 세포형성 촉진, 노폐물 배출", "analogy": "방전된 배터리에 고속 충전기를 꽂는 것과 같습니다. 필요없는 지방세포를 빠르게 분해, 배출합니다", "mechan ication": "소아 성장, 야경, 야제, 틱, ADHD", "summary": "근건이완수기요법 (날척법, 안유법 등)을 통한 소아 맞춤형 이완 치료", "analogy": "나무가 곧게 자라도록 지지대를 세워주고, 거친 흙을 부드럽게 다져주는 정원사의 손길과 같습니다.", "mechanism": ["척추 라인 자극(날척)을 통한 자율신경 조절", "근육 이완 및 성장판 자극", "심리적 안정 유도"], "chart": {"phase_inflam": 20, "phase_prolif": 90, "phase_remodel": 80, "phase_maint": 100}, "icon": "🧒", "tags": ["소아성장", "야제증", "틱장애", "날척법"]}, {"id": "ETC_TAPING", "name": "밸런스 테이핑 요법", "category": "기타", "type": "structural", "indication": "근육통, 관절 불안정, 스포츠 손상 예방", "summary": "신축성 테이프를 이용해 근육 기능을 보조하고 신체 밸런스를 잡음", "analogy": "약해진 근육 위에 탄력 있는 보조 근육을 하나 더 덧대어 지탱해주는 원리입니다.", "mechanism": ["피부를 들어올려 림프 및 혈류 순환 개선", "근육의 수축/이완 기능 보조", "관절의 안정성 확보"], "chart": {"phase_inflam": 80, "phase_prolif": 80, "phase_remodel": 60, "phase_maint": 90}, "icon": "🩹", "tags": ["키네시오", "부상방지"]}, {"id": "ETC_TOGU", "name": "독일 TOGU 밸런스 치료", "category": "기타", "type": "structural", "indication": "척추신경 밸런스, 코어 강화, 협응력 강화, 하지 고유수용성감각 향상", "summary": "Challenge Disc 2.0 (EU특허 2081651)을 이용한 과학적 밸런스 훈련", "analogy": "내 몸 안의 수평계(자이로스코프)를 훈련시킵니다. 트레이너 없이도 앱과 센서가 내 몸의 균형을 잡아줍니다.", "mechanism": ["특허받은 다축 플랫폼을 통한 고유수용성 감각 자극", "블루투스 센서 기반 실시간 피드백", "Bodyteamwork 앱을 통한 맞춤형 코어/하체 훈련"], "chart": {"phase_inflam": 10, "phase_prolif": 50, "phase_remodel": 90, "phase_maint": 100}, "icon": "⚖️", "tags": ["재활운동", "코어강화", "스마트훈련", "Bodyteamwork"]}, {"id": "ETC_RESP", "name": "호흡기 치료", "category": "기타", "type": "flow", "indication": "비염, 감기, 축농증, 호흡기 질환", "summary": "네블라이저, 코세척, 레이저침, 호흡기 IR을 이용한 복합 관리", "analogy": "건조하고 막힌 굴뚝(숨길)을 청소하고, 따뜻한 증기로 촉촉하게 적셔 환기를 돕습니다.", "mechanism": ["점막 습윤 및 섬모 운동 촉진", "레이저를 통한 혈류 개선 및 염증 완화", "비강 내 노폐물 세척"], "chart": {"phase_inflam": 90, "phase_prolif": 60, "phase_remodel": 40, "phase_maint": 70}, "icon": "🫁", "tags": ["비염관리", "네블라이저", "감기"]}, {"id": "ETC_AROMA", "name": "향기(아로마) 치료", "category": "기타", "type": "gentle", "indication": "스트레스, 불면, 심신 불안, 두통", "summary": "천연 에센셜 오일의 향기를 이용한 심신 이완 및 치유", "analogy": "복잡한 도시를 떠나 숲속 깊은 곳에서 피톤치드를 마시듯, 뇌를 쉬게 하고 마음 00 to-rose-300", "label": "저자극 (Gentle)", "desc": "부드럽고 편안한 치료입니다"}}, "kind": "treatment"}</script><script>const guide=JSON.parse(document.getElementById('guide-data').textContent);
const grid=document.getElementById('guide-grid'),filters=document.getElementById('guide-filters'),search=document.getElementById('guide-search'),dialog=document.getElementById('guide-detail');
let category='전체';

const labels={indication:'적응 증상들',summary:guide.kind==='diagnostic'?'검사 소개':'치료 소개',tcm_story:'한의학적 설명',analogy:'쉽게 이해하기',scientific_evidence:'작용 설명',mechanism:guide.kind==='diagnostic'?'검사 원리':'치료 원리',ingredients:'구성 약재',note:'복용 및 참고 안내'};
const prescriptionNotice = guide.kind==='prescription' ? `<p class="prescription-notice">참고로, 한약은 다른 병이라도 같은 약이 처방 될 수 있으며, 같은 병이라도 다른 약이 처방 될 수 있습니다. '변증'이 우선되기 때문입니다</p>` : '';
function chart(data){
 const names={diag_precision:'정밀도',diag_speed:'신속성',diag_comfort:'편안함',diag_scope:'정보량',qi_def:'기허',qi_stag:'기울',qi_counter:'기역',blood_def:'혈허',blood_stasis:'어혈',fluid:'수체',yin_def:'음허',phase_inflam:'어혈/염증기',phase_prolif:'재생/증식기',phase_remodel:'리모델링기',phase_maint:'유지/재활기'};
 const keys=Object.keys(data),point=(i,r)=>{const a=i*2*Math.PI/keys.length-Math.PI/2;return [180+Math.cos(a)*r,180+Math.sin(a)*r];};
 return `<svg viewBox="0 0 360 360" role="img" aria-label="${esc(keys.map(k=>names[k]+': '+data[k]).join(', '))}">${[25,50,75,100].map(r=>`<polygon points="${keys.map((_,i)=>point(i,r).join(',')).join(' ')}" fill="none" stroke="#E2E8F0"/>`).join('')}<polygon points="${keys.map((k,i)=>point(i,data[k]).join(',')).join(' ')}" fill="#2563EB22" stroke="#2563EB" stroke-width="2"/>${keys.map((k,i)=>{const [x,y]=point(i,138);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#475569">${names[k]} ${data[k]}</text>`;}).join('')}</svg>`;
}
function treatmentIcon(item){
 return ['treatment','diagnostic'].includes(guide.kind) && item.icon ? `<span class="treatment-icon" aria-hidden="true">${esc(item.icon)}</span>` : '';
}

 dialog.showModal();
}
function render(){
 const term=search.value.trim().toLowerCase();const items=guide.data.filter(item=>(category==='전체'||item.category===category)&&[item.name,item.code,item.indication,item.summary,...(item.tags||item.symptoms||[])].join(' ').toLowerCase().includes(term));
